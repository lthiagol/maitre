name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: the gate
    runs-on: ubuntu-latest
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          # the floor go.mod declares: the code must build on the version it claims
          go-version: '1.26.0'
          cache: true

      - name: install the tools
        run: make tools

      - name: put the tools on the PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: the gate
        run: make ci
